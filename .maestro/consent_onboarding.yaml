appId: com.stride.sprint
name: "Consent Onboarding, cannot proceed without both checkboxes"
---
# Fresh launch → register → consent screen
- launchApp:
    clearState: true

# Navigate to register (new user)
- tapOn:
    id: "auth-alternate"

- tapOn:
    id: "email-input"

- inputText: "e2e-test-user@stride.ai"

- tapOn:
    id: "password-input"

- inputText: "TestPassword123!"

- hideKeyboard

- tapOn:
    id: "auth-submit"

# Consent screen should appear
- assertVisible:
    id: "terms-checkbox"

- assertVisible:
    id: "medical-checkbox"

- assertVisible:
    id: "consent-continue-btn"

# Continue button should be disabled, tapping should not advance the screen
- tapOn:
    id: "consent-continue-btn"

- assertVisible:
    id: "terms-checkbox"
    # Still on consent screen

# Check only terms, still blocked
- tapOn:
    id: "terms-checkbox"

- tapOn:
    id: "consent-continue-btn"

- assertVisible:
    id: "medical-checkbox"
    # Still on consent screen

# Check medical too, now should be able to continue
- tapOn:
    id: "medical-checkbox"

- tapOn:
    id: "consent-continue-btn"

# Should advance to profile/welcome screen
- assertVisible:
    text: "Make it personal."
