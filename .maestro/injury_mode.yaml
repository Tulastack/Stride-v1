appId: com.stridebiometrics.stride
name: "I am injured today, recovery-only view shown, no sprint drills"
---
- launchApp

# Sign in as pre-consented test user with a completed analysis
- tapOn:
    id: "email-input"

- inputText: "consented-user@stride.ai"

- tapOn:
    id: "password-input"

- inputText: "TestPassword123!"

- hideKeyboard

- tapOn:
    id: "auth-submit"

- tapOn:
    id: "tab-progress"

- tapOn:
    id: "progress-log-.*"
    index: 0

- tapOn:
    text: "Open full analysis"

# Injury toggle should be visible
- assertVisible:
    id: "injury-toggle"

# Recovery notice should NOT be visible initially
- assertNotVisible:
    id: "recovery-mode-notice"

# Tap the injury toggle
- tapOn:
    id: "injury-toggle"

# Recovery notice should now appear
- assertVisible:
    id: "recovery-mode-notice"

# Verify recovery text
- assertVisible:
    text: "Recovery Mode.*"

# Sprint drills should NOT be offered (no corrective drill section)
- assertNotVisible:
    id: "add-to-plan-.*"

- tapOn:
    text: "Practice"

- assertNotVisible:
    id: "drill-.*"
