appId: com.stride.sprint
name: "Analysis result screen, disclaimer text is visible"
---
- launchApp

# Sign in as pre-consented test user
- tapOn:
    id: "email-input"

- inputText: "consented-user@stride.ai"

- tapOn:
    id: "password-input"

- inputText: "TestPassword123!"

- hideKeyboard

- tapOn:
    id: "auth-submit"

- tapOn:
    id: "tab-progress"

- tapOn:
    id: "progress-log-.*"
    index: 0

- tapOn:
    text: "Open full analysis"

# Disclaimer must be visible on analysis screen (accessibilityLabel)
- assertVisible:
    id: "analysis-disclaimer"

# Verify disclaimer text content
- assertVisible:
    text: "Coaching insights, not medical advice.*"
