services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stride_test
      POSTGRES_USER: stride
      POSTGRES_PASSWORD: stride_dev
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stride -d stride_test"]
      interval: 3s
      timeout: 5s
      retries: 10

  localstack-test:
    image: localstack/localstack:3.8.0
    environment:
      SERVICES: s3,sqs
      DEFAULT_REGION: us-east-1
    ports:
      - "4567:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 10s
      retries: 10

  localstack-test-init:
    image: amazon/aws-cli:latest
    depends_on:
      localstack-test:
        condition: service_healthy
    entrypoint: /bin/sh
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    command: >
      -c "
        aws --endpoint-url=http://localstack-test:4566 s3 mb s3://stride-videos-test --region us-east-1 &&
        aws --endpoint-url=http://localstack-test:4566 sqs create-queue --queue-name stride-analysis-test --region us-east-1 &&
        aws --endpoint-url=http://localstack-test:4566 sqs create-queue --queue-name stride-analysis-test-dlq --region us-east-1 &&
        echo 'Test resources created'
      "

volumes:
  postgres_test_data:
