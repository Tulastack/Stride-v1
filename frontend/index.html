<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Registration</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .card {
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 420px;
    }
    h1 { margin: 0 0 1.5rem; font-size: 1.4rem; }
    label { display: block; margin-bottom: 0.25rem; font-size: 0.9rem; font-weight: 500; }
    input {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 2px rgba(79,70,229,0.2); }
    button {
      width: 100%;
      padding: 0.6rem;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover { background: #4338ca; }
    button:disabled { background: #a5b4fc; cursor: not-allowed; }
    #message {
      margin-top: 1rem;
      padding: 0.6rem 0.75rem;
      border-radius: 4px;
      font-size: 0.9rem;
      display: none;
    }
    #message.success { background: #d1fae5; color: #065f46; }
    #message.error   { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>User Registration</h1>
    <form id="registrationForm" novalidate>
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" name="firstName" required autocomplete="given-name" />

      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" name="lastName" required autocomplete="family-name" />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" />

      <button type="submit" id="submitBtn">Register</button>
    </form>
    <div id="message" role="alert" aria-live="polite"></div>
  </div>

  <script>
    const API_URL = 'http://stride-alb-1962699315.us-east-1.elb.amazonaws.com/api/users';

    document.getElementById('registrationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');

      const payload = {
        firstName: document.getElementById('firstName').value.trim(),
        lastName:  document.getElementById('lastName').value.trim(),
        email:     document.getElementById('email').value.trim(),
      };

      // Basic client-side validation
      if (!payload.firstName || !payload.lastName || !payload.email) {
        showMessage('All fields are required.', 'error');
        return;
      }

      btn.disabled = true;
      msg.style.display = 'none';

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const data = await res.json();

        if (res.ok) {
          showMessage('Registration successful!', 'success');
          e.target.reset();
        } else {
          showMessage(data.error || 'Registration failed.', 'error');
        }
      } catch (err) {
        showMessage('Could not reach the server. Please try again.', 'error');
      } finally {
        btn.disabled = false;
      }
    });

    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = type;
      msg.style.display = 'block';
    }
  </script>
</body>
</html>
